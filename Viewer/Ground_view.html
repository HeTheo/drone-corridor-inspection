<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>走廊巡检 · 模拟飞行（机头朝墙 / 侧飞）</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f14;overflow:hidden;
    color:#8ff;font:13px ui-monospace,monospace}
  canvas{display:block}
  #hud{position:fixed;left:14px;top:12px;z-index:2;line-height:1.7}
  #hud b{color:#39ff88}
  #legend{position:fixed;right:16px;bottom:16px;z-index:2;line-height:1.7;
    text-align:right;color:#5a7a8a;font-size:12px}
  #ctrl{position:fixed;left:14px;bottom:14px;z-index:2}
  button{background:#16212b;color:#8ff;border:1px solid #2a3a49;border-radius:6px;
    padding:6px 12px;font:inherit;cursor:pointer}
  button:hover{background:#1e2c38}
</style>
</head>
<body>
<div id="hud"></div>
<div id="legend">
  上方 = 墙（含消防栓）<br>
  ▲ 机头 / 雷达 0° / 摄像头 都朝墙<br>
  → 机身侧飞方向
</div>
<div id="ctrl">
  <button id="btnPlay">⏸ 暂停</button>
  <button id="btnReset">↻ 重置</button>
</div>
<canvas id="cv"></canvas>
<script>
// ================= 场景参数（按你的真实布局）=================
// 走廊：沿 East 方向长 20m，横向（North）宽 4m
const CORRIDOR_L  = 20.0;          // 走廊长度（侧飞方向）
const CORRIDOR_W  = 4.0;           // 走廊宽度
const WALL_N      = CORRIDOR_W/2;  // 墙在 north=+2（屏幕上方）
const TARGET_DIST = 2.0;           // PID 目标：到墙 2m（走廊正中）

const HYDRANTS = [6.0, 13.0, 17.0]; // 墙上消防栓（沿走廊坐标）
const CAM_HALF_FOV = 25.0;          // 摄像头半视场角（度），总 FOV 50°
// ============================================================

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let scale = 1, ox = 0, oy = 0;

function fit(){
  cv.width = innerWidth; cv.height = innerHeight;
  const padX = 140, padY = 120;
  scale = Math.min((cv.width - padX*2)/CORRIDOR_L,
                   (cv.height - padY*2)/CORRIDOR_W);
  ox = (cv.width - CORRIDOR_L*scale)/2;   // east=0 → 走廊左端
  oy = cv.height/2;                        // north=0 → 屏幕垂直中间
}
addEventListener('resize', fit);

// NED → 屏幕像素：north 向上，east 向右
const toPx = (n, e) => [ox + e*scale, oy - n*scale];

// ================= 模拟状态（全是假的）=================
const drone = { north:0, east:0, down:0, yaw:0 };
const trail = [];
let t = 0, playing = true, done = false, lastTs = performance.now();

function reset(){
  t = 0; done = false; playing = true;
  drone.north = drone.east = drone.down = drone.yaw = 0;
  trail.length = 0;
  document.getElementById('btnPlay').textContent = '⏸ 暂停';
}

// 假动作：起飞 → 悬停 → 沿走廊侧飞（机头始终朝墙＝北）
function update(dt){
  if (!playing || done) return;
  t += dt;

  const CRUISE = 0.5, T_TAKEOFF = 3, T_HOVER = 5;

  if (t < T_TAKEOFF){                    // 起飞
    drone.down  = -2.5 * (t/T_TAKEOFF);
    drone.north = 0;  drone.yaw = 0;
  } else if (t < T_HOVER){               // 悬停
    drone.down  = -2.5;
    drone.north = Math.sin(t*1.5) * 0.05;   // 到墙距离小抖动
    drone.yaw   = Math.sin(t*1.0) * 3;
  } else {                               // 侧飞巡检
    const ct = t - T_HOVER;
    drone.east  = Math.min(CORRIDOR_L - 2, ct * CRUISE);   // 沿走廊平移
    drone.down  = -2.5 + Math.sin(ct*1.2) * 0.04;
    drone.north = Math.sin(ct*0.9) * 0.10;   // PID 稳距离在 2m 附近
    drone.yaw   = Math.sin(ct*0.7) * 4;      // 机头始终大致朝墙(0°)
    if (drone.east >= CORRIDOR_L - 2) done = true;
  }
}

// 摄像头两条边缘射线打到墙上的位置（沿墙 East 坐标）
function camHits(p){
  const h = p.yaw*Math.PI/180, half = CAM_HALF_FOV*Math.PI/180, res = [];
  [-half, +half].forEach(d=>{
    const a = h + d, c = Math.cos(a);
    if (c <= 0.05) return;                  // 射线不朝墙，忽略
    const s = (WALL_N - p.north)/c;
    res.push(p.east + s*Math.sin(a));
  });
  return res;
}

// ---------- 绘制 ----------
function drawCorridor(){
  const [x0,y0] = toPx(WALL_N, 0);          // 左上
  const [x1,y1] = toPx(-WALL_N, CORRIDOR_L);// 右下
  ctx.fillStyle = '#121a22';
  ctx.fillRect(x0, y0, x1-x0, y1-y0);

  // 1m 网格
  ctx.strokeStyle = '#1a242e'; ctx.lineWidth = 1;
  for (let e=0; e<=CORRIDOR_L; e+=1){
    const [gx] = toPx(0,e);
    ctx.beginPath(); ctx.moveTo(gx,y0); ctx.lineTo(gx,y1); ctx.stroke();
  }
  for (let n=-WALL_N; n<=WALL_N; n+=1){
    const [,gy] = toPx(n,0);
    ctx.beginPath(); ctx.moveTo(x0,gy); ctx.lineTo(x1,gy); ctx.stroke();
  }

  // 走廊边框
  ctx.strokeStyle = '#2a3a49'; ctx.lineWidth = 2;
  ctx.strokeRect(x0, y0, x1-x0, y1-y0);

  // 上方的墙（摄像头拍摄面）
  ctx.strokeStyle = '#5c6b7a'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y0); ctx.stroke();
  ctx.fillStyle = '#7a8b9a'; ctx.font = '12px monospace';
  ctx.fillText('墙（摄像头拍摄面）', x0+8, y0-16);

  // 米标
  ctx.fillStyle = '#3a4a5a'; ctx.font = '11px monospace';
  for (let e=0; e<=CORRIDOR_L; e+=5){
    const [gx] = toPx(0,e);
    ctx.fillText(e+'m', gx+4, y1+18);
  }

  // 起飞点
  const [sx] = toPx(0,0);
  ctx.strokeStyle = '#3a4a5a'; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(sx,y0); ctx.lineTo(sx,y1); ctx.stroke();
  ctx.setLineDash([]);
}

function drawHydrants(seen){
  HYDRANTS.forEach((e,i)=>{
    const [x,y] = toPx(WALL_N, e);
    const det = seen.has(i);
    ctx.fillStyle = det ? '#39ff88' : '#ff5d5d';
    ctx.beginPath(); ctx.arc(x, y+12, 7, 0, 7); ctx.fill();
    if (det){
      ctx.strokeStyle = '#39ff88'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y+12, 13, 0, 7); ctx.stroke();
    }
    ctx.fillStyle = det ? '#39ff88' : '#ffb3b3';
    ctx.font = '11px monospace';
    ctx.fillText(det ? '✔ 已识别' : '消防栓', x-20, y+34);
  });
}

function drawCamFOV(p, hits){
  if (hits.length !== 2) return;
  const [ax,ay] = toPx(p.north, p.east);
  const [h1x,h1y] = toPx(WALL_N, hits[0]);
  const [h2x,h2y] = toPx(WALL_N, hits[1]);
  ctx.fillStyle = 'rgba(90,200,255,.10)';
  ctx.beginPath(); ctx.moveTo(ax,ay);
  ctx.lineTo(h1x,h1y); ctx.lineTo(h2x,h2y); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(90,200,255,.30)'; ctx.lineWidth = 1; ctx.stroke();
}

function drawLidar(p){
  const dist = WALL_N - p.north;             // 到墙的垂直距离
  const [x0,y0] = toPx(p.north, p.east);
  const [x1,y1] = toPx(WALL_N, p.east);
  ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 1.5;
  ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ffd23f'; ctx.font = '11px monospace';
  ctx.fillText(dist.toFixed(2)+'m', x1+6, (y0+y1)/2+4);
  return dist;
}

function drawDrone(p){
  const [x,y] = toPx(p.north, p.east);

  // 航迹
  trail.push([x,y]); if (trail.length > 4000) trail.shift();
  ctx.strokeStyle = 'rgba(57,255,136,.30)'; ctx.lineWidth = 2;
  ctx.beginPath();
  trail.forEach(([tx,ty],i)=> i?ctx.lineTo(tx,ty):ctx.moveTo(tx,ty));
  ctx.stroke();

  // 机身（三角，机头朝北=向上，随 yaw 转）
  ctx.save(); ctx.translate(x,y); ctx.rotate(p.yaw*Math.PI/180);
  ctx.shadowColor = '#39ff88'; ctx.shadowBlur = 12;
  ctx.fillStyle = '#39ff88';
  ctx.beginPath();
  ctx.moveTo(0,-11); ctx.lineTo(7,9); ctx.lineTo(0,5); ctx.lineTo(-7,9);
  ctx.closePath(); ctx.fill();
  ctx.restore(); ctx.shadowBlur = 0;

  // 侧飞方向箭头（东 = 右）
  ctx.strokeStyle = 'rgba(57,255,136,.55)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x+16,y); ctx.lineTo(x+38,y);
  ctx.lineTo(x+31,y-5); ctx.moveTo(x+38,y); ctx.lineTo(x+31,y+5);
  ctx.stroke();
}

function drawAltitude(p){
  const bx = cv.width-46, by0 = 90, by1 = cv.height-90, hmax = 4;
  const h = -p.down;
  ctx.fillStyle = '#121a22'; ctx.fillRect(bx, by0, 14, by1-by0);
  ctx.strokeStyle = '#2a3a49'; ctx.strokeRect(bx, by0, 14, by1-by0);
  const hy = by1 - (h/hmax)*(by1-by0);
  ctx.fillStyle = '#39ff88'; ctx.fillRect(bx, hy, 14, by1-hy);
  ctx.fillStyle = '#8ff'; ctx.font = '11px monospace';
  ctx.fillText(h.toFixed(2)+'m', bx-48, hy+4);
}

function drawHUD(p, dist, seen){
  const err = dist - TARGET_DIST;              // 横向误差（cm）
  const det = seen.size ? `✔ 检测到消防栓 x${seen.size}` : '搜索中…';
  document.getElementById('hud').innerHTML =
    `高度 <b>${(-p.down).toFixed(2)} m</b><br>` +
    `到墙距离 <b>${dist.toFixed(2)} m</b>（目标 ${TARGET_DIST.toFixed(2)}m）<br>` +
    `横向误差 <b>${err>=0?'+':''}${(err*100).toFixed(0)} cm</b><br>` +
    `沿走廊 E <b>${p.east.toFixed(2)} m</b>　航向 <b>${p.yaw.toFixed(0)}°</b><br>` +
    `相机 <b>${det}</b>`;
}

function frame(ts){
  const dt = Math.min(0.05,(ts-lastTs)/1000); lastTs = ts;
  update(dt);
  ctx.clearRect(0,0,cv.width,cv.height);

  const hits = camHits(drone);
  const seen = new Set();
  if (hits.length === 2){
    const lo = Math.min(...hits), hi = Math.max(...hits);
    HYDRANTS.forEach((e,i)=>{ if (e>=lo && e<=hi) seen.add(i); });
  }

  drawCorridor();
  drawHydrants(seen);
  drawCamFOV(drone, hits);
  const dist = drawLidar(drone);
  drawDrone(drone);
  drawAltitude(drone);
  drawHUD(drone, dist, seen);
  requestAnimationFrame(frame);
}

document.getElementById('btnPlay').onclick = (e)=>{
  playing = !playing;
  e.target.textContent = playing ? '⏸ 暂停' : '▶ 播放';
};
document.getElementById('btnReset').onclick = reset;

fit(); requestAnimationFrame(frame);
</script>
</body>
</html>
